<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최강3부 허브</title>
<style>
  :root{
    --bg:#FAF7EF; --surface:#FFFFFF; --ink:#262A20; --ink-soft:#6B6F5F;
    --primary:#15703A; --primary-light:#2FA85C; --primary-dim:#C4EBCF;
    --border:#D9D2BC; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:28px 16px 40px; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:640px; margin:0 auto;}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:28px;}

  .card-list{display:flex; flex-direction:column; gap:14px;}
  .card{
    display:block; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:18px 20px; text-decoration:none; color:inherit;
  }
  .card:hover{border-color:var(--primary-light);}
  .card-title{font-size:16px; font-weight:700; color:var(--primary); margin-bottom:4px;}
  .card-desc{font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .card-tag{
    display:inline-block; margin-top:10px; font-size:11px; font-weight:700;
    color:var(--primary); background:var(--primary-dim); border-radius:999px; padding:3px 9px;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>최강3부 허브</h1>
  <p class="sub">choi3 프로젝트 안의 화면들을 한곳에서 찾아볼 수 있습니다.</p>

  <div class="card-list">
    <a class="card" href="/">
      <div class="card-title">관리 시스템</div>
      <div class="card-desc">섭외자 · 만남 일정 · 구역 관리 등 백오피스 전체 기능.</div>
      <span class="card-tag">비밀번호 필요</span>
    </a>

    <a class="card" href="/7Ius67Cp">
      <div class="card-title">주일예배 분석</div>
      <div class="card-desc">출석 보고 텍스트를 붙여넣으면 구역별·시간대별로 자동 집계, 출석 대시보드와 추이 그래프까지.</div>
      <span class="card-tag">비밀번호 필요</span>
    </a>

    <a class="card" href="/c0p3X0jZsu.html">
      <div class="card-title">체크리스트</div>
      <div class="card-desc">사명자 요일별 체크리스트 — 이름을 입력해 본인 체크, 관리자는 비밀번호로 항목 관리·현황 확인.</div>
      <span class="card-tag">이름 입력</span>
    </a>
  </div>
</div>

</body>
</html>
