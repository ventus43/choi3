<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최강3 관리 시스템</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
</head>
<body>

<div class="app-header">
  <div class="brand">
    <h1>최강3부 관리시스템</h1>
  </div>
</div>

<div class="screenshot-bar-wrap">
  <div class="screenshot-bar" id="screenshot-bar">
    <span class="ss-label">화면 캡처</span>
    <button type="button" data-ss="panel-zonestat">섭외자 리스트</button>
    <button type="button" data-ss="panel-meetsched">만남 일정</button>
    <button type="button" data-ss="panel-check">TM 현황</button>
    <span class="ss-status" id="screenshot-status"></span>
  </div>
</div>

<div class="tabbar">
  <button class="tab active" data-tab="zonestat">섭외자 리스트 <span class="count" id="count-zonestat">0</span></button>
  <button class="tab" data-tab="meetsched">만남 일정 <span class="count" id="count-meetsched">0</span></button>
  <button class="tab" data-tab="check">TM 현황 <span class="count" id="count-check">0</span></button>
  <div class="tabbar-edit">
    <span class="tabbar-edit-label">등록 · 수정</span>
    <button class="tab tab-edit" data-tab="schedule">일정 목록 <span class="count" id="count-schedule">0</span></button>
    <button class="tab tab-edit" data-tab="outreach">창출 목록 <span class="count" id="count-outreach">0</span></button>
    <button class="tab tab-edit" data-tab="member">구역 관리 <span class="count" id="count-member">0</span></button>
  </div>
</div>

<!-- 각 탭 패널은 src/main.js 가 tabs/<name>.js 의 TEMPLATE 을 여기 주입한다 -->
<div class="stage"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
