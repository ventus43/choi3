<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최강3 관리 시스템</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
</head>
<body>

<div class="app-header">
  <div class="brand">
    <h1>최강3부 관리시스템</h1>
  </div>
</div>

<div class="screenshot-bar-wrap">
  <button type="button" class="screenshot-toggle" id="screenshot-toggle" aria-expanded="false" aria-controls="screenshot-bar">화면 캡처</button>
  <div class="screenshot-bar" id="screenshot-bar" hidden>
    <button type="button" data-ss="panel-zonestat">섭외자 리스트</button>
    <button type="button" data-ss="panel-meetsched">만남 일정</button>
    <button type="button" data-ss="panel-check">TM 현황</button>
    <span class="ss-status" id="screenshot-status"></span>
  </div>
</div>

<div class="tabbar" role="tablist" aria-label="관리 화면">
  <button type="button" class="tab active" data-tab="zonestat" id="tab-zonestat" role="tab" aria-selected="true" aria-controls="panel-zonestat">섭외자 리스트 <span class="count" id="count-zonestat">0</span></button>
  <button type="button" class="tab" data-tab="meetsched" id="tab-meetsched" role="tab" aria-selected="false" aria-controls="panel-meetsched">만남 일정 <span class="count" id="count-meetsched">0</span></button>
  <button type="button" class="tab" data-tab="check" id="tab-check" role="tab" aria-selected="false" aria-controls="panel-check">TM 현황 <span class="count" id="count-check">0</span></button>
  <!-- 운영 대시보드 탭: 작업 완료 후 노출 예정, 임시로 숨김
  <button type="button" class="tab" data-tab="dashboard" id="tab-dashboard" role="tab" aria-selected="false" aria-controls="panel-dashboard">운영 대시보드</button>
  -->
  <div class="tabbar-edit">
    <span class="tabbar-edit-label">등록 · 수정</span>
    <button type="button" class="tab tab-edit" data-tab="schedule" id="tab-schedule" role="tab" aria-selected="false" aria-controls="panel-schedule">일정 목록 <span class="count" id="count-schedule">0</span></button>
    <button type="button" class="tab tab-edit" data-tab="outreach" id="tab-outreach" role="tab" aria-selected="false" aria-controls="panel-outreach">창출 목록 <span class="count" id="count-outreach">0</span></button>
    <button type="button" class="tab tab-edit" data-tab="member" id="tab-member" role="tab" aria-selected="false" aria-controls="panel-member">구역 관리 <span class="count" id="count-member">0</span></button>
  </div>
</div>

<!-- 각 탭 패널은 src/main.js 가 tabs/<name>.js 의 TEMPLATE 을 여기 주입한다 -->
<div class="stage"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
