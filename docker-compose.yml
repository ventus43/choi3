services:
  db:
    image: mysql:8.0
    command: --default-time-zone=+09:00
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: choi3
      MYSQL_USER: choi3
      MYSQL_PASSWORD: "tjdgh2814@@"
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "choi3", "-ptjdgh2814@@"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./local-api
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "5174:5174"
    environment:
      API_TARGET: http://api:8081
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
    depends_on:
      - api

volumes:
  mysql_data:
