# choi3 백오피스 — choi3.gventus.store
# 배포: GitHub Actions 가 이 파일을 /etc/nginx/sites-available/choi3 로 복사 → nginx -t → reload
# 최초 1회: DNS A레코드(choi3.gventus.store → EC2 IP) + 인증서 발급
#   sudo certbot certonly --nginx -d choi3.gventus.store
#   sudo ln -s /etc/nginx/sites-available/choi3 /etc/nginx/sites-enabled/choi3

# HTTP → HTTPS
server {
    listen 80;
    server_name choi3.gventus.store;
    return 301 https://choi3.gventus.store$request_uri;
}

server {
    listen 443 ssl;
    server_name choi3.gventus.store;

    ssl_certificate     /etc/letsencrypt/live/choi3.gventus.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/choi3.gventus.store/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /home/ubuntu/choi3/dist;
    index index.html;

    # 정적 자산은 캐시, 나머지는 SPA 폴백(/choi3-office/... 라우팅용)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flask API (gunicorn, 127.0.0.1:8001) — 끝의 / 로 /api 프리픽스 제거
    location /api/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
